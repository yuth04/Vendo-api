services:
  - type: web
    name: python-ai
    runtime: python
    rootDir: python-ai
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:8000 app:app
    envVars:
      - key: LARAVEL_API_URL
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
    plan: standard  # needs at least 2GB RAM for CLIP